<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <title>{{project.title}}</title>
    <style type="text/css">
        * { -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #canvas { outline: none; border: 0; width: 100%; height: 100%; overflow: hidden; display: block; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas" tabindex='1'></canvas>
    </div>
    
    <script type="text/javascript">
        var engine_arguments = [{{exe_arguments}}];
        var custom_heap_size = {{heap_size}};
        var full_screen_container = "#canvas-container";
        var Module = {
            noInitialRun: true,
            canvas: document.getElementById("canvas"),
            arguments: engine_arguments,
            TOTAL_MEMORY: custom_heap_size
        };
    </script>
    <script type="text/javascript" src="dmloader.js"></script>
    <script type="text/javascript">
        EngineLoader.stream_wasm = "{{stream_wasm}}" === "true";
        EngineLoader.load("canvas", "{{exe_name}}");
    </script>
</body>
</html>
